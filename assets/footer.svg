<svg xmlns="http://www.w3.org/2000/svg" width="880" height="108" viewBox="0 0 880 108" fill="none" role="img">
<defs>
<style>
  .m { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes blink  { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  /* 'backwards' (not 'both') is deliberate: if a renderer ignores CSS
     animation entirely, the element falls back to its natural opacity:1
     instead of staying invisible. */
  .fi { animation: fadein .6s ease-out backwards; }
  .cursor { animation: blink 1.1s step-end infinite; }

</style>

</defs>
<rect width="880" height="108" rx="10" fill="#0A0A0B"/>
<rect x="0" y="0" width="880" height="108" rx="10" fill="#101014" stroke="#1F1F25"/>
<g class="fi"><text x="32" y="44" class="m" font-size="15" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">$</text><text x="52" y="44" class="m" font-size="15" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">echo $STATUS</text></g>
<g class="fi" style="animation-delay:0.24s"><text x="32" y="74" class="m" font-size="13" fill="#7A7A85" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Building AI products at Dock. Open to interesting problems and good teams.<tspan class="cursor" fill="#00E5A0"> █</tspan></text></g>
<text x="848" y="74" class="m" font-size="11" fill="#4A4A54" font-weight="400" text-anchor="end" letter-spacing="1.2" opacity="1">avivashishta.com</text>
</svg>
