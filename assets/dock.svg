<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" fill="none" role="img">
<defs>
<style>
  .m { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes blink  { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  /* 'backwards' (not 'both') is deliberate: if a renderer ignores CSS
     animation entirely, the element falls back to its natural opacity:1
     instead of staying invisible. */
  .fi { animation: fadein .6s ease-out backwards; }
  .cursor { animation: blink 1.1s step-end infinite; }

</style>

</defs>
<rect width="880" height="320" rx="10" fill="#0A0A0B"/>
<rect x="0" y="0" width="880" height="320" rx="10" fill="#101014" stroke="#1F1F25"/>
<rect x="0" y="0" width="4" height="320" rx="2" fill="#00E5A0"/>
<g class="fi" style="animation-delay:0.10s"><text x="32" y="46" class="m" font-size="26" fill="#EDEDEF" font-weight="700" text-anchor="start" letter-spacing="2" opacity="1">DOCK</text><text x="148" y="46" class="m" font-size="12" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">dock.us</text></g>
<g class="fi" style="animation-delay:0.17s"><rect x="662" y="26" width="186" height="26" rx="13" fill="#00E5A0" fill-opacity=".09" stroke="#00E5A0" stroke-opacity=".35"/><circle cx="680" cy="39" r="4" fill="#00E5A0"><animate attributeName="opacity" values="1;.25;1" dur="2.2s" repeatCount="indefinite"/></circle><text x="692" y="43" class="m" font-size="10" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="1.4" opacity="1">HERE SINCE MAR 2025</text></g>
<g class="fi" style="animation-delay:0.24s"><text x="32" y="76" class="m" font-size="13" fill="#7A7A85" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">AI revenue enablement — deal rooms, content and onboarding in one place.</text></g>
<line x1="32" y1="98" x2="848" y2="98" stroke="#1F1F25"/>
<g class="fi" style="animation-delay:0.31s"><rect x="32" y="116" width="248" height="60" rx="6" fill="#16161B" stroke="#1F1F25"/><text x="48" y="140" class="m" font-size="11" fill="#00E5A0" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">DEAL ROOMS</text><text x="48" y="160" class="m" font-size="11" fill="#7A7A85" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">buyer-facing workspaces</text></g>
<g class="fi" style="animation-delay:0.38s"><rect x="304" y="116" width="248" height="60" rx="6" fill="#16161B" stroke="#1F1F25"/><text x="320" y="140" class="m" font-size="11" fill="#00E5A0" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">CONTENT</text><text x="320" y="160" class="m" font-size="11" fill="#7A7A85" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">one library, one link</text></g>
<g class="fi" style="animation-delay:0.45s"><rect x="576" y="116" width="248" height="60" rx="6" fill="#16161B" stroke="#1F1F25"/><text x="592" y="140" class="m" font-size="11" fill="#00E5A0" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">ONBOARDING</text><text x="592" y="160" class="m" font-size="11" fill="#7A7A85" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">mutual action plans</text></g>
<g class="fi" style="animation-delay:0.52s"><text x="32" y="210" class="m" font-size="12" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">// what I do here</text></g>
<g class="fi" style="animation-delay:0.59s"><text x="32" y="236" class="m" font-size="13" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→</text><text x="56" y="236" class="m" font-size="13" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Ship AI-powered features on a Next.js, Node.js and GraphQL stack</text></g>
<g class="fi" style="animation-delay:0.66s"><text x="32" y="260" class="m" font-size="13" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→</text><text x="56" y="260" class="m" font-size="13" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Build against AWS SQS for asynchronous messaging infrastructure</text></g>
<g class="fi" style="animation-delay:0.73s"><text x="32" y="284" class="m" font-size="13" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">→</text><text x="56" y="284" class="m" font-size="13" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Own features end to end — schema, API, interface, rollout</text></g>
</svg>
