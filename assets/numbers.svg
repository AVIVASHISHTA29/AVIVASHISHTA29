<rect x="308" y="128" width="272" height="92" rx="8" fill="#101014" stroke="#1F1F25"/>
<rect x="308" y="128" width="272" height="2" rx="1" fill="#FF7A45" opacity=".55"/>
<text x="328" y="174" class="m" font-size="28" fill="#FF7A45" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">2×</text>
<text x="328" y="194" class="m" font-size="10" fill="#EDEDEF" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">YC-BACKED COMPANIES</text>
<text x="328" y="209" class="m" font-size="10" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">AccioJob · Dock.us</text>
</g>
<g class="fi" style="animation-delay:0.50s">
<rect x="600" y="128" width="272" height="92" rx="8" fill="#101014" stroke="#1F1F25"/>
