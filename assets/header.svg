<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" fill="none" role="img">
<defs>
<style>
  .m { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes blink  { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  /* 'backwards' (not 'both') is deliberate: if a renderer ignores CSS
     animation entirely, the element falls back to its natural opacity:1
     instead of staying invisible. */
  .fi { animation: fadein .6s ease-out backwards; }
  .cursor { animation: blink 1.1s step-end infinite; }

</style>

<clipPath id="hclip"><rect width="880" height="230" rx="10"/></clipPath>
<radialGradient id="glow"><stop offset="0%" stop-color="#00E5A0" stop-opacity=".14"/><stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/></radialGradient>
<linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0A0A0B" stop-opacity="0"/><stop offset="100%" stop-color="#0A0A0B" stop-opacity=".85"/></linearGradient>

</defs>
<rect width="880" height="230" rx="10" fill="#0A0A0B"/>

  <g clip-path="url(#hclip)">
    <line x1="0" y1="0" x2="0" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="44" y1="0" x2="44" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="88" y1="0" x2="88" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="132" y1="0" x2="132" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="176" y1="0" x2="176" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="220" y1="0" x2="220" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="264" y1="0" x2="264" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="308" y1="0" x2="308" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="352" y1="0" x2="352" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="396" y1="0" x2="396" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="440" y1="0" x2="440" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="484" y1="0" x2="484" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="528" y1="0" x2="528" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="572" y1="0" x2="572" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="616" y1="0" x2="616" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="660" y1="0" x2="660" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="704" y1="0" x2="704" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="748" y1="0" x2="748" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="792" y1="0" x2="792" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="836" y1="0" x2="836" y2="230" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="0" y1="0" x2="880" y2="0" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="0" y1="44" x2="880" y2="44" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="0" y1="88" x2="880" y2="88" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="0" y1="132" x2="880" y2="132" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="0" y1="176" x2="880" y2="176" stroke="#1F1F25" stroke-width="1" opacity=".55"/><line x1="0" y1="220" x2="880" y2="220" stroke="#1F1F25" stroke-width="1" opacity=".55"/>
    <circle cx="742" cy="70" r="150" fill="url(#glow)"/>
    <rect x="0" y="0" width="880" height="230" fill="url(#vig)"/>
    <rect id="scan" x="0" y="0" width="880" height="2" fill="#00E5A0" opacity=".16">
      <animate attributeName="y" values="-4;230;-4" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="fi" style="animation-delay:.05s">
    <text x="44" y="62" class="m" font-size="13" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">$ ./introduce --self</text>
  </g>

  <g class="fi" style="animation-delay:.20s">
    <text x="44" y="118" class="m" font-size="44" fill="#EDEDEF" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">AVI VASHISHTA<tspan class="cursor" fill="#00E5A0"> █</tspan></text>
  </g>

  <g class="fi" style="animation-delay:.34s">
    <text x="44" y="150" class="m" font-size="15" fill="#7A7A85" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Fullstack developer  ·  AI builder  ·  instructor</text>
  </g>

  <g class="fi" style="animation-delay:.46s">
    <line x1="44" y1="172" x2="836" y2="172" stroke="#1F1F25"/>
    <text x="44" y="197" class="m" font-size="11" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="1.6" opacity="1">NEW DELHI, IN</text>
    <text x="180" y="197" class="m" font-size="11" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="1.6" opacity="1">NEXT.JS · NODE · GRAPHQL · AI · THREE.JS</text>
    <text x="836" y="197" class="m" font-size="11" fill="#00E5A0" font-weight="400" text-anchor="end" letter-spacing="1.6" opacity="1">OPEN TO COLLABORATE</text>
  </g>

</svg>
