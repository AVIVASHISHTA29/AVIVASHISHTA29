<path class="gline" d="M 84.0 228.1 L 235.2 195.1 L 386.4 202.9 L 537.6 156.5 L 688.8 68.3" stroke="#00E5A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
