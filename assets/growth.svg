<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" fill="none" role="img">
<defs>
<style>
  .m { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes blink  { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  /* 'backwards' (not 'both') is deliberate: if a renderer ignores CSS
     animation entirely, the element falls back to its natural opacity:1
     instead of staying invisible. */
  .fi { animation: fadein .6s ease-out backwards; }
  .cursor { animation: blink 1.1s step-end infinite; }

  .gline { stroke-dasharray: 2400; stroke-dashoffset: 0; animation: trace 2s cubic-bezier(.6,0,.2,1) backwards; animation-delay:.2s; }
  @keyframes trace { from { stroke-dashoffset: 2400; } to { stroke-dashoffset: 0; } }

</style>

<linearGradient id="garea" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#00E5A0" stop-opacity=".30"/>
  <stop offset="100%" stop-color="#00E5A0" stop-opacity="0"/>
</linearGradient>

</defs>
<rect width="880" height="300" rx="10" fill="#0A0A0B"/>
<rect x="0" y="0" width="880" height="300" rx="10" fill="#101014" stroke="#1F1F25"/>
