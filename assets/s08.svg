<svg xmlns="http://www.w3.org/2000/svg" width="880" height="56" viewBox="0 0 880 56" fill="none" role="img">
<defs>
<style>
  .m { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes blink  { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  /* 'backwards' (not 'both') is deliberate: if a renderer ignores CSS
     animation entirely, the element falls back to its natural opacity:1
     instead of staying invisible. */
  .fi { animation: fadein .6s ease-out backwards; }
  .cursor { animation: blink 1.1s step-end infinite; }

</style>

</defs>
<rect width="880" height="56" rx="10" fill="#0A0A0B"/>

  <text x="0" y="34" class="m" font-size="13" fill="#00E5A0" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">08</text>
  <text x="30" y="34" class="m" font-size="13" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">—</text>
  <text x="56" y="34" class="m" font-size="15" fill="#EDEDEF" font-weight="700" text-anchor="start" letter-spacing="2.4" opacity="1">SELECTED WORK</text>
  <line x1="228" y1="29" x2="800" y2="29" stroke="#1F1F25"/>
  <text x="880" y="34" class="m" font-size="11" fill="#4A4A54" font-weight="400" text-anchor="end" letter-spacing="1.6" opacity="1">PROJECTS</text>

</svg>
