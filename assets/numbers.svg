<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236" fill="none" role="img">
<defs>
<style>
  .m { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes blink  { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  /* 'backwards' (not 'both') is deliberate: if a renderer ignores CSS
     animation entirely, the element falls back to its natural opacity:1
     instead of staying invisible. */
  .fi { animation: fadein .6s ease-out backwards; }
  .cursor { animation: blink 1.1s step-end infinite; }

</style>

</defs>
<rect width="880" height="236" rx="10" fill="#0A0A0B"/>
<g class="fi" style="animation-delay:0.10s">
<rect x="16" y="16" width="272" height="92" rx="8" fill="#101014" stroke="#1F1F25"/>
<rect x="16" y="16" width="272" height="2" rx="1" fill="#00E5A0" opacity=".55"/>
<text x="36" y="62" class="m" font-size="28" fill="#00E5A0" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">100K+</text>
<text x="36" y="82" class="m" font-size="10" fill="#EDEDEF" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">DEVELOPERS TAUGHT</text>
<text x="36" y="97" class="m" font-size="10" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">MERN stack, online</text>
</g>
<g class="fi" style="animation-delay:0.18s">
<rect x="308" y="16" width="272" height="92" rx="8" fill="#101014" stroke="#1F1F25"/>
<rect x="308" y="16" width="272" height="2" rx="1" fill="#5AC8FA" opacity=".55"/>
<text x="328" y="62" class="m" font-size="28" fill="#5AC8FA" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">500+</text>
<text x="328" y="82" class="m" font-size="10" fill="#EDEDEF" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">PULL REQUESTS REVIEWED</text>
<text x="328" y="97" class="m" font-size="10" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">as founding engineer</text>
</g>
<g class="fi" style="animation-delay:0.26s">
<rect x="600" y="16" width="272" height="92" rx="8" fill="#101014" stroke="#1F1F25"/>
<rect x="600" y="16" width="272" height="2" rx="1" fill="#C084FC" opacity=".55"/>
<text x="620" y="62" class="m" font-size="28" fill="#C084FC" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">300+</text>
<text x="620" y="82" class="m" font-size="10" fill="#EDEDEF" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">FEATURES SHIPPED</text>
<text x="620" y="97" class="m" font-size="10" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">highest on the team</text>
</g>
<g class="fi" style="animation-delay:0.34s">
<rect x="16" y="128" width="272" height="92" rx="8" fill="#101014" stroke="#1F1F25"/>
<rect x="16" y="128" width="272" height="2" rx="1" fill="#00E5A0" opacity=".55"/>
<text x="36" y="174" class="m" font-size="28" fill="#00E5A0" font-weight="700" text-anchor="start" letter-spacing="1" opacity="1">20K+</text>
<text x="36" y="194" class="m" font-size="10" fill="#EDEDEF" font-weight="700" text-anchor="start" letter-spacing="1.4" opacity="1">GITHUB CONTRIBUTIONS</text>
<text x="36" y="209" class="m" font-size="10" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">since 2021</text>
</g>
