<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" fill="none" role="img">
<defs>
<style>
  .m { font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes blink  { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
  /* 'backwards' (not 'both') is deliberate: if a renderer ignores CSS
     animation entirely, the element falls back to its natural opacity:1
     instead of staying invisible. */
  .fi { animation: fadein .6s ease-out backwards; }
  .cursor { animation: blink 1.1s step-end infinite; }

</style>

</defs>
<rect width="880" height="280" rx="10" fill="#0A0A0B"/>
<rect x="0" y="0" width="880" height="280" rx="10" fill="#101014" stroke="#1F1F25"/>
<line x1="0" y1="38" x2="880" y2="38" stroke="#1F1F25"/>
<circle cx="22" cy="19" r="5" fill="#3A3A42"/>
<circle cx="39" cy="19" r="5" fill="#3A3A42"/>
<circle cx="56" cy="19" r="5" fill="#3A3A42"/>
<text x="84" y="24" class="m" font-size="11" fill="#4A4A54" font-weight="400" text-anchor="start" letter-spacing="1" opacity="1">avi@dock ~ /about</text>
<g class="fi" style="animation-delay:0.10s"><text x="32" y="78" class="m" font-size="14" fill="#FF7A45" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">const</text><text x="88" y="78" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">avi</text><text x="124" y="78" class="m" font-size="14" fill="#7A7A85" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">= {</text></g>
<g class="fi" style="animation-delay:0.17s"><text x="56" y="102" class="m" font-size="14" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">role:</text><text x="156" y="102" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">"Software Engineer @ Dock.us",</text></g>
<g class="fi" style="animation-delay:0.24s"><text x="56" y="124" class="m" font-size="14" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">age:</text><text x="156" y="124" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">23,</text></g>
<g class="fi" style="animation-delay:0.31s"><text x="56" y="146" class="m" font-size="14" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">based:</text><text x="156" y="146" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">"New Delhi, India",</text></g>
<g class="fi" style="animation-delay:0.38s"><text x="56" y="168" class="m" font-size="14" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">degree:</text><text x="156" y="168" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">"BTech CS, IIIT Delhi '24",</text></g>
<g class="fi" style="animation-delay:0.45s"><text x="56" y="190" class="m" font-size="14" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">was:</text><text x="156" y="190" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">["founding engineer", "instructor", "founder"],</text></g>
<g class="fi" style="animation-delay:0.52s"><text x="56" y="212" class="m" font-size="14" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">builds:</text><text x="156" y="212" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">["AI products", "web", "mobile", "3D interfaces"],</text></g>
<g class="fi" style="animation-delay:0.59s"><text x="56" y="234" class="m" font-size="14" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">taught:</text><text x="156" y="234" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">100_000, // developers, MERN stack</text></g>
<g class="fi" style="animation-delay:0.66s"><text x="56" y="256" class="m" font-size="14" fill="#00E5A0" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">open_to:</text><text x="156" y="256" class="m" font-size="14" fill="#EDEDEF" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">"Interesting problems, good teams"</text></g>
<g class="fi" style="animation-delay:0.73s"><text x="32" y="278" class="m" font-size="14" fill="#7A7A85" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">};</text></g>
