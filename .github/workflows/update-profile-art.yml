name: Update profile art

# Refreshes the contribution graph + stats card SVGs daily from real data.
# Runs daily, plus whenever you push to main, plus on-demand.

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC every day
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install onnxruntime
          pip install opencv-python-headless pillow numpy rembg
          pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py AVIVASHISHTA29 contrib-heatmap.svg

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      # --- ADD THE IMAGE CONVERSION EXECUTIONS HERE ---
      - name: Prepare profile photo
        run: python scripts/prep_photo.py source-photo.png source-prepped.png

      - name: Generate ASCII art portrait SVG
        run: python scripts/make_ascii_svg.py source-prepped.png avi-ascii.svg
      # ------------------------------------------------

      - name: commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph and ascii art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg source-prepped.png avi-ascii.svg"
